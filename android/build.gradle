plugins {
    id 'com.android.library'
}

// AGP 9 provides Kotlin unless the consuming build explicitly disables it.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlin = providers.gradleProperty('android.builtInKotlin').orNull != 'false'
if (agpMajor < 9 || !builtInKotlin) {
    apply plugin: 'kotlin-android'
}

group 'com.ahmedsleem.terminate_restart'
version '1.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace 'com.ahmedsleem.terminate_restart'
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

// Configure the task directly: the Android kotlinOptions extension is absent
// when AGP supplies Kotlin. This also works with older Kotlin Gradle plugins.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = '17'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
